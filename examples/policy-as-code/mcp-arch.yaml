# One repository, named as a cluster of one.
#
# `repos:` rather than `repo:` on purpose. It is what gives the snapshot a repo
# LABEL, and the label is what joins a page's anchors to the files they name:
# an anchor says {repo: policy-as-code, path: cardholder/vault.go}, and with a
# label present the join resolves. Without one, `governed_by` and
# `require_governed` resolve to nothing at all, and the laws that read them
# hold vacuously.
repos:
  - "."
output:
  dir: ".enola"
