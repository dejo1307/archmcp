openapi: 3.0.0
info:
  title: Widgets Service
  version: 1.0.0
paths:
  /widgets:
    get:
      operationId: listWidgets
      summary: List all widgets
      tags:
        - widgets
      responses:
        "200":
          description: OK
    post:
      operationId: createWidget
      summary: Create a widget
      tags:
        - widgets
      responses:
        "201":
          description: Created
  /widgets/{id}:
    get:
      operationId: getWidget
      summary: Get a widget by id
      tags:
        - widgets
      responses:
        "200":
          description: OK
