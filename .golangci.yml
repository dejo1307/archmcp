# Minimal, high-signal linter set to start. The CI lint job is non-blocking
# (continue-on-error) until this baseline is green; broaden the enabled list and
# remove continue-on-error in ci.yml once the existing findings are addressed.
run:
  timeout: 5m
  tests: true

linters:
  disable-all: true
  enable:
    - govet
    - staticcheck
    - errcheck
    - ineffassign
    - unused

issues:
  # Show all findings (don't cap per-linter/per-file) so the true baseline is visible.
  max-issues-per-linter: 0
  max-same-issues: 0
  exclude-rules:
    # Test fixtures under testdata/ are intentionally non-idiomatic sample code.
    - path: testdata/
      linters:
        - errcheck
        - staticcheck
        - unused
