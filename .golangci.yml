# golangci-lint v2 config. Minimal, high-signal linter set to start. CI runs
# with only-new-issues=true, so the existing backlog (run `golangci-lint run`
# locally to see it) is grandfathered and only PR-introduced findings gate the
# build. Broaden the enabled list and chip away at the baseline over time.
version: "2"

linters:
  default: none
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
